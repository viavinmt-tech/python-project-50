name: Python CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install uv
          make install
      
      - name: DEBUG - Show installed packages
        run: |
          echo "=== PIP LIST ==="
          uv run pip list
          echo "=== CHECK PYTEST ==="
          uv run python -c "import pytest; print('pytest OK')" || echo "pytest NOT FOUND"
          echo "=== CHECK PYTEST-COV ==="
          uv run python -c "import pytest_cov; print('pytest-cov OK')" || echo "pytest-cov NOT FOUND"
      
      - name: Run linter and tests
        run: |
          uv run ruff check .
          uv run pytest tests/ -v --cov=gendiff --cov-report=xml
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=hexlet-boilerplates_python-package
            -Dsonar.organization=hexlet-boilerplates
            -Dsonar.python.coverage.reportPaths=coverage.xml